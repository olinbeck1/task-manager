<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#130b26">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Neon Goals</title>
<style>
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
/* Layout: one-column phone app. Header on top, bottom tab bar (Цели / Сегодня), goal detail slides over as a full screen, forms open as bottom sheets. */
:root {
  --bg: #130b26;
  --surface: #1d1238;
  --surface-2: #281a4b;
  --line: #3d2b6b;
  --text: #f5f1ff;
  --muted: #c0b3e3;
  --pink: #ff4fd8;
  --cyan: #35e8ff;
  --violet: #b794ff;
  --orange: #ff9f43;
  --blue: #6f9bff;
  --done: #b6ff3d;
  --danger: #ff6b8a;
  --ink: #12091f;
  --display: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); }
body {
  margin: 0;
  color: var(--text);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.45;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 112px;
  background:
    radial-gradient(520px 320px at 100% -40px, rgba(255,79,216,.20), transparent 70%),
    radial-gradient(480px 360px at -60px 30%, rgba(53,232,255,.10), transparent 70%),
    var(--bg);
  background-attachment: fixed;
  min-height: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 10; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding: 18px 0 12px; }
.top .date { color: var(--muted); font-size: 14px; text-transform: capitalize; }
.top h1 { margin: 2px 0 0; font-family: var(--display); font-weight: 700; font-size: 26px; letter-spacing: .01em; text-shadow: 0 0 18px rgba(255,79,216,.55); }
.top .sub { margin-top: 6px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: 14px; }
.sync { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--orange); }
.sync.synced::before { background: var(--done); box-shadow: 0 0 8px var(--done); }
.sync.error::before { background: var(--danger); }

.section-title { margin: 22px 0 10px; font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.section-title.overdue { color: var(--danger); }

/* goal cards */
.list { display: grid; gap: 12px; }
.card {
  --gc: var(--pink);
  background: var(--surface);
  border: 1px solid color-mix(in srgb, var(--gc) 45%, var(--line));
  border-radius: 18px;
  padding: 16px;
  display: grid;
  gap: 12px;
  box-shadow: 0 0 22px color-mix(in srgb, var(--gc) 14%, transparent);
  cursor: pointer;
}
.card.achieved { background: color-mix(in srgb, var(--done) 9%, var(--surface)); }
.card:active { transform: scale(.992); }
.card-top { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.tags { display: flex; gap: 8px; flex-wrap: wrap; min-width: 0; }
.chip { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); max-width: 100%; overflow-wrap: anywhere; }
.chip.goal { color: var(--gc); background: color-mix(in srgb, var(--gc) 16%, var(--surface)); }
.badge { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--done); color: var(--ink); }
.card h3 { margin: 0; font-size: 18px; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
.card .foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }

/* progress */
.bar { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; border-radius: 999px; background: var(--gc, var(--pink)); box-shadow: 0 0 12px var(--gc, var(--pink)); transition: width .5s ease; }
.bar-row { display: grid; gap: 6px; }
.bar-label { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.bar-label b { color: var(--text); font-variant-numeric: tabular-nums; }

/* streak */
.streak { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15px; flex: none; }
.flame { width: 22px; height: 22px; flex: none; }
.flame path { fill: currentColor; }
.streak.lit { color: var(--orange); }
.streak.lit .flame { filter: drop-shadow(0 0 5px var(--orange)) drop-shadow(0 0 12px var(--pink)); animation: flick 1.6s ease-in-out infinite; }
.streak.ember { color: var(--orange); opacity: .85; }
.streak.ember .flame { filter: drop-shadow(0 0 4px rgba(255,159,67,.6)); }
.streak.out { color: #8f82b5; }
@keyframes flick { 0%,100% { transform: scale(1) rotate(-2deg); } 50% { transform: scale(1.1) rotate(2deg); } }

/* tasks */
.tasks { display: grid; gap: 8px; }
.date-group { margin-top: 16px; }
.date-label { font-size: 13px; font-weight: 700; color: var(--muted); margin: 0 0 8px; text-transform: capitalize; }
.date-label.overdue { color: var(--danger); }
.task { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px 8px 8px 10px; min-height: 52px; }
.task .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.task .txt small { display: block; color: var(--muted); font-size: 12px; }
.task.done .title { text-decoration: line-through; text-decoration-thickness: 2px; text-decoration-color: var(--done); color: var(--muted); }
.check { width: 32px; height: 32px; flex: none; border-radius: 10px; border: 2px solid var(--gc, var(--pink)); background: transparent; display: grid; place-items: center; padding: 0; }
.check svg { width: 18px; height: 18px; opacity: 0; stroke: var(--ink); }
.check[aria-checked="true"] { background: var(--done); border-color: var(--done); box-shadow: 0 0 10px rgba(182,255,61,.55); }
.check[aria-checked="true"] svg { opacity: 1; }
.icon-btn { width: 44px; height: 44px; flex: none; border: 0; border-radius: 12px; background: transparent; color: var(--muted); display: grid; place-items: center; }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn:active { background: var(--surface-2); }
.empty { text-align: center; color: var(--muted); padding: 36px 12px; border: 1px dashed var(--line); border-radius: 18px; }
.empty b { display: block; color: var(--text); font-family: var(--display); font-weight: 600; margin-bottom: 6px; }

/* buttons + forms */
.btn { border: 0; border-radius: 14px; min-height: 48px; padding: 0 20px; font-weight: 700; background: var(--pink); color: var(--ink); box-shadow: 0 0 18px rgba(255,79,216,.45); }
.btn.ghost { background: var(--surface-2); color: var(--text); box-shadow: none; border: 1px solid var(--line); }
.btn.danger { background: transparent; color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 55%, var(--line)); box-shadow: none; }
.btn.done-btn { background: var(--done); box-shadow: 0 0 18px rgba(182,255,61,.4); }
.btn.block { width: 100%; }
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field label, .field .lbl { font-size: 13px; font-weight: 600; color: var(--muted); }
input[type=text], input[type=date], select, textarea {
  width: 100%; min-height: 48px; padding: 10px 14px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; font-size: 16px; color: var(--text);
}
textarea { min-height: 84px; resize: vertical; }
input::placeholder, textarea::placeholder { color: #9d8fc4; }
input:focus, select:focus, textarea:focus { border-color: var(--cyan); outline: none; box-shadow: 0 0 0 3px rgba(53,232,255,.25); }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatch { width: 44px; height: 44px; border-radius: 50%; border: 3px solid transparent; background: var(--c); box-shadow: 0 0 12px var(--c); padding: 0; }
.swatch[aria-checked="true"] { border-color: var(--text); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 420px) { .row2 { grid-template-columns: 1fr; } }

/* nav + fab */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: color-mix(in srgb, var(--bg) 94%, transparent); border-top: 1px solid var(--line); padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.nav-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.tab { min-height: 48px; border: 0; border-radius: 14px; background: transparent; color: var(--muted); font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; }
.tab svg { width: 20px; height: 20px; }
.tab[aria-selected="true"] { background: var(--surface-2); color: var(--cyan); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--cyan) 55%, transparent); }
.fab { position: fixed; z-index: 9; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); width: 60px; height: 60px; border-radius: 50%; border: 0; background: var(--pink); color: var(--ink); display: grid; place-items: center; box-shadow: 0 0 24px rgba(255,79,216,.7); }
.fab svg { width: 28px; height: 28px; }

/* detail screen + sheet */
.detail { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; overscroll-behavior: contain; padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) calc(32px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.detail .wrap { padding-top: 8px; }
.dbar { display: flex; justify-content: space-between; align-items: center; margin-inline: -8px; }
.dtitle { margin: 8px 0 8px; font-family: var(--display); font-weight: 700; font-size: 22px; line-height: 1.25; overflow-wrap: anywhere; text-shadow: 0 0 16px color-mix(in srgb, var(--gc) 60%, transparent); }
.desc { color: var(--muted); margin: 0 0 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
.panel { background: var(--surface); border: 1px solid color-mix(in srgb, var(--gc) 40%, var(--line)); border-radius: 18px; padding: 16px; display: grid; gap: 14px; margin-bottom: 14px; }
.streak-panel { display: flex; align-items: center; gap: 14px; }
.streak-panel .flame { width: 44px; height: 44px; }
.streak-panel .num { font-family: var(--display); font-weight: 700; font-size: 28px; line-height: 1; }
.streak-panel small { display: block; color: var(--muted); font-size: 13px; margin-top: 4px; }
.addtask { display: grid; gap: 10px; margin: 18px 0 4px; }
.addtask .row2 { grid-template-columns: 1fr auto; align-items: stretch; }
.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(8,3,20,.72); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-bottom: 0; border-radius: 22px 22px 0 0; padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet h2 { margin: 0 0 16px; font-family: var(--display); font-weight: 600; font-size: 18px; }
.actions { display: flex; gap: 10px; margin-top: 6px; }
.actions .btn { flex: 1; }
.toast { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); background: var(--done); color: var(--ink); font-weight: 700; padding: 12px 18px; border-radius: 14px; box-shadow: 0 0 22px rgba(182,255,61,.55); max-width: calc(100% - 32px); text-align: center; }
@media (prefers-reduced-motion: reduce) { .streak.lit .flame { animation: none; } .bar > i { transition: none; } }
.top .backup { position: absolute; right: -8px; top: 14px; }
.hint { color: var(--muted); font-size: 14px; margin: 0 0 14px; }
.tab { gap: 6px; font-size: 14px; padding: 0 4px; }
.rowflex { display: flex; align-items: center; gap: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-btn { min-width: 44px; min-height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text); font-weight: 700; }
.chip-btn[aria-pressed="true"] { background: var(--cyan); border-color: var(--cyan); color: var(--ink); box-shadow: 0 0 12px rgba(53,232,255,.45); }
.mdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.mdays .chip-btn { min-width: 0; padding: 0; }
.quick { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.quick .chip-btn { min-height: 40px; font-size: 14px; }
.opt { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface-2); margin-bottom: 10px; cursor: pointer; }
.opt input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--cyan); flex: none; }
.opt b { display: block; }
.opt small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.opt:has(input:checked) { border-color: var(--cyan); box-shadow: 0 0 0 1px var(--cyan); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.day { display: grid; justify-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
.dot { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--line); background: transparent; padding: 0; display: grid; place-items: center; color: var(--muted); font-size: 12px; font-weight: 700; }
.dot.sch { border-color: var(--gc); color: var(--text); }
.dot.on { background: var(--done); border-color: var(--done); color: var(--ink); box-shadow: 0 0 10px rgba(182,255,61,.5); }
.dot.today { box-shadow: 0 0 0 3px color-mix(in srgb, var(--cyan) 55%, transparent); }
.dot.on.today { box-shadow: 0 0 10px rgba(182,255,61,.5), 0 0 0 3px color-mix(in srgb, var(--cyan) 55%, transparent); }
.dot:disabled { opacity: .4; cursor: default; }
.dot svg { width: 16px; height: 16px; stroke: var(--ink); }
.hcard { cursor: default; }
.daynav { display: flex; align-items: center; gap: 4px; margin: 2px 0 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 2px 4px; }
.daylab { flex: 1; min-width: 0; min-height: 48px; border: 0; background: transparent; color: var(--text); font-family: var(--display); font-weight: 600; font-size: 16px; text-transform: capitalize; }
.daylab small { display: block; font-family: var(--body); font-weight: 600; font-size: 12px; color: var(--cyan); text-transform: none; }
.qadd { display: flex; gap: 8px; margin-bottom: 6px; }
.qadd input { flex: 1; min-width: 0; }
.sec-count { color: var(--cyan); text-transform: none; letter-spacing: 0; margin-left: 6px; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <button class="icon-btn backup" data-action="backup" aria-label="Резервная копия"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></button>
    <div class="date" id="today-date"></div>
    <h1 id="screen-title">Цели</h1>
    <div class="sub"><span id="summary"></span></div>
  </header>
  <main id="view"></main>
</div>

<button class="fab" id="fab" data-action="new-goal" aria-label="Новая цель">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav class="nav" aria-label="Разделы">
  <div class="nav-in" role="tablist">
    <button class="tab" role="tab" data-action="tab" data-tab="goals" id="tab-goals">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg>Цели
    </button>
    <button class="tab" role="tab" data-action="tab" data-tab="habits" id="tab-habits">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></svg>Привычки
    </button>
    <button class="tab" role="tab" data-action="tab" data-tab="today" id="tab-today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11M3.5 6l1.2 1.2L7 4.8M3.5 12l1.2 1.2L7 10.8M3.5 18l1.2 1.2L7 16.8"/></svg>Мой день
    </button>
  </div>
</nav>

<div id="detail" class="detail" hidden></div>
<div id="overlay" class="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" hidden></div>

<script>
(function () {
  "use strict";
  var KEY = "neon-goals-v1";
  var COLORS = { pink: "#ff4fd8", cyan: "#35e8ff", violet: "#b794ff", orange: "#ff9f43", blue: "#6f9bff" };
  var COLOR_NAMES = { pink: "Розовый", cyan: "Голубой", violet: "Фиолетовый", orange: "Оранжевый", blue: "Синий" };
  var DONE_COLOR = "#b6ff3d";
  var CATS = ["Учёба", "Работа", "Проекты", "Здоровье", "Личное", "Другое"];
  var FLAME = '<svg class="flame" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.5 2c.6 3.6 5.5 5.9 5.5 10.6A6 6 0 0 1 12 19a6 6 0 0 1-6-6.4c0-2.4 1.2-4 2.3-5.1.1 1.8.9 2.9 2 3.3C9.6 7.6 10.6 4.6 12.5 2z"/></svg>';
  var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>';
  var EDIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg>';
  var BACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>';

  /* ---------- helpers ---------- */
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function uid() { return Math.random().toString(36).slice(2, 8) + Date.now().toString(36); }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function fmt(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function parse(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function today() { return fmt(new Date()); }
  function addDays(s, n) { var d = parse(s); d.setDate(d.getDate() + n); return fmt(d); }
  function diffDays(a, b) { return Math.round((parse(a) - parse(b)) / 86400000); }
  function plural(n, f) { var m10 = n % 10, m100 = n % 100; if (m10 === 1 && m100 !== 11) return f[0]; if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return f[1]; return f[2]; }
  var TASKS = ["задача", "задачи", "задач"], DAYS = ["день", "дня", "дней"], GOALS = ["цель", "цели", "целей"];
  function longDate(s) { return parse(s).toLocaleDateString("ru-RU", { day: "numeric", month: "long" }); }
  function dayLabel(s) {
    var t = today(), d = diffDays(s, t);
    if (d === 0) return "Сегодня, " + longDate(s);
    if (d === 1) return "Завтра, " + longDate(s);
    if (d === -1) return "Вчера, " + longDate(s);
    return parse(s).toLocaleDateString("ru-RU", { weekday: "short", day: "numeric", month: "long" });
  }
  function goalColor(g) { return COLORS[g.color] || COLORS.pink; }

  /* ---------- state + storage ---------- */
  var state = loadLocal();
  function loadLocal() {

  function dayHeader() {

  /* ---------- habits ---------- */

  var CAL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17M9 15h6M13 13l2 2-2 2"/></svg>';

  function freqText(h) {

    if (h.kind === "weekly_n") return (h.n || 1) + " " + plural(h.n || 1, ["раз", "раза", "раз"]) + " в неделю";

  }
  function habitsView() {

      '<form data-form="resched" data-g="' + g.id + '" data-t="' + t.id + '" autocomplete="off">' +
      '<div class="field"><label for="r-date">Новая дата</label><input type="date" id="r-date" required value="' + def + '">' +
      '<div class="quick"><button type="button" class="chip-btn" data-action="quick-date" data-n="0">Сегодня</button><button type="button" class="chip-btn" data-action="quick-date" data-n="1">Завтра</button><button type="button" class="chip-btn" data-action="quick-date" data-n="7">Через неделю</button></div></div>' +
      '<div class="field"><span class="lbl">Что перенести</span>' +
      '<label class="opt"><input type="radio" name="r-mode" value="one" checked><span><b>Только эту задачу</b><small>Остальные задачи цели останутся на своих датах</small></span></label>' +
      '<label class="opt"><input type="radio" name="r-mode" value="all"><span><b>Эту и все следующие</b><small>' +
      (later ? 'Ещё ' + later + ' ' + plural(later, TASKS) + ' цели, которые стоят позже и не выполнены, сдвинутся на столько же дней' : 'Позже невыполненных задач в этой цели нет, результат будет как в первом варианте') +
      '</small></span></label></div>' +
      '<div class="actions"><button type="button" class="btn ghost" data-action="close-sheet">Отмена</button><button type="submit" class="btn">Перенести</button></div></form>');
  }
  function submitResched(f) {
    var g = findGoal(f.dataset.g); if (!g) return;
    var t = null; g.tasks.forEach(function (x) { if (x.id === f.dataset.t) t = x; });
    var nd = $("r-date").value; if (!t || !nd) return;
    var checked = f.querySelector('input[name="r-mode"]:checked'), mode = checked ? checked.value : "one";
    var old = t.date, delta = diffDays(nd, old);
    if (delta === 0) { closeSheet(); return; }
    var moved = 1; t.date = nd;
    if (mode === "all") g.tasks.forEach(function (x) { if (x !== t && !x.done && x.date > old) { x.date = addDays(x.date, delta); moved++; } });
    persist(); closeSheet(); renderAll();
    toast(moved > 1 ? "Сдвинуто задач: " + moved : "Задача перенесена на " + longDate(nd));
  }

  /* detail screen */
  function openDetail(id) {
    openId = id;
    var el = $("detail");
    el.hidden = false; el.scrollTop = 0;
    var g = findGoal(id);
    el.innerHTML = '<div class="wrap" style="--gc:' + goalColor(g) + '"><div id="d-head"></div>' +
      '<form class="addtask" data-form="task" autocomplete="off"><div class="field" style="margin:0"><label for="t-title">Новая задача</label>' +
      '<input type="text" id="t-title" maxlength="140" placeholder="Что нужно сделать" required></div>' +
      '<div class="row2"><input type="date" id="t-date" aria-label="Дата задачи" required><button class="btn" type="submit">Добавить</button></div></form>' +
      '<div id="d-list"></div></div>';
    $("t-date").value = today();
    renderDetailParts();
  }
  function renderDetailParts() {
    var g = findGoal(openId);
    if (!g) { closeDetail(); return; }
    var s = stats(g), color = s.achieved ? DONE_COLOR : goalColor(g);
    var wrap = $("detail").firstElementChild;
    wrap.style.setProperty("--gc", color);
    var sMsg = s.state === "lit" ? "Сегодня задача выполнена, огонёк горит"
      : s.state === "ember" ? "Выполни задачу сегодня, иначе огонёк погаснет"
      : s.best > 0 ? "Огонёк погас. Выполни задачу сегодня, чтобы начать заново"
      : "Выполни первую задачу, чтобы зажечь огонёк";
    var dl = deadlineText(g, s);
    $("d-head").innerHTML =
      '<div class="dbar"><button class="icon-btn" data-action="back" aria-label="Назад">' + BACK + '</button>' +
      '<button class="icon-btn" data-action="edit-goal" aria-label="Редактировать цель">' + EDIT + '</button></div>' +
      '<div class="tags" style="margin-top:4px">' + (s.achieved ? '<span class="badge">Достигнута</span>' : '') +
      (g.cat ? '<span class="chip goal">' + esc(g.cat) + '</span>' : '') + (dl ? '<span class="chip">' + esc(dl) + '</span>' : '') + '</div>' +
      '<h2 class="dtitle">' + esc(g.title) + '</h2>' + (g.desc ? '<p class="desc">' + esc(g.desc) + '</p>' : '') +
      '<section class="panel">' + progressBar(s, color) +
      '<div class="streak-panel"><span class="streak ' + s.state + '">' + FLAME + '</span><div><div class="num">' + s.streak + ' ' + plural(s.streak, DAYS) + '</div><small>' + sMsg + (s.best ? ' · рекорд ' + s.best : '') + '</small></div></div>' +
      '<button class="btn ' + (g.forced ? "ghost" : (s.achieved ? "ghost" : "done-btn")) + ' block" data-action="force" ' + (s.achieved && !g.forced ? "disabled style=\"opacity:.6\"" : "") + '>' +
      (g.forced ? "Вернуть в работу" : s.achieved ? "Все задачи выполнены" : "Отметить цель достигнутой") + '</button></section>';
    var groups = {};
    g.tasks.forEach(function (t) { (groups[t.date] = groups[t.date] || []).push(t); });
    var td = today(), dates = Object.keys(groups).sort();
    $("d-list").innerHTML = dates.length ? dates.map(function (d) {
      var list = groups[d].slice().sort(function (a, b) { return (a.done ? 1 : 0) - (b.done ? 1 : 0); });
      var over = d < td && list.some(function (t) { return !t.done; });
      return '<div class="date-group"><p class="date-label' + (over ? " overdue" : "") + '">' + esc(dayLabel(d)) + (over ? " · просрочено" : "") + '</p><div class="tasks">' +
        list.map(function (t) { return taskRow(g, t, false); }).join("") + '</div></div>';
    }).join("") : '<div class="empty" style="margin-top:18px"><b>Задач пока нет</b>Добавь первую задачу и выбери дату.</div>';
  }
  function closeDetail() { openId = null; $("detail").hidden = true; $("detail").innerHTML = ""; renderAll(); }

  /* sheets */
  function openSheet(html) { $("sheet").innerHTML = html; $("overlay").hidden = false; }
  function closeSheet() { $("overlay").hidden = true; $("sheet").innerHTML = ""; }
  function goalForm(g) {
    var edit = !!g, color = edit ? (g.color || "pink") : "pink";
    var sw = Object.keys(COLORS).map(function (k) {
      return '<button type="button" class="swatch" style="--c:' + COLORS[k] + '" role="radio" aria-checked="' + (k === color) + '" aria-label="' + COLOR_NAMES[k] + '" data-action="color" data-color="' + k + '"></button>';
    }).join("");
    var cats = CATS.map(function (c) { return '<option' + ((edit ? g.cat : "Учёба") === c ? " selected" : "") + '>' + c + '</option>'; }).join("");
    openSheet('<h2>' + (edit ? "Карточка цели" : "Новая цель") + '</h2>' +
      '<form data-form="goal" data-id="' + (edit ? g.id : "") + '" autocomplete="off">' +
      '<div class="field"><label for="g-title">Название</label><input type="text" id="g-title" maxlength="100" required placeholder="Например, сдать сессию на отлично" value="' + esc(edit ? g.title : "") + '"></div>' +
      '<div class="field"><label for="g-desc">Описание и зачем это нужно</label><textarea id="g-desc" maxlength="600" placeholder="Что именно считается результатом">' + esc(edit ? g.desc : "") + '</textarea></div>' +
      '<div class="row2"><div class="field"><label for="g-cat">Категория</label><select id="g-cat">' + cats + '</select></div>' +
      '<div class="field"><label for="g-dl">Срок (необязательно)</label><input type="date" id="g-dl" value="' + esc(edit ? g.deadline || "" : "") + '"></div></div>' +
      '<div class="field"><span class="lbl">Цвет</span><div class="swatches" role="radiogroup" id="g-colors" data-color="' + color + '">' + sw + '</div></div>' +
      '<div class="actions"><button type="button" class="btn ghost" data-action="close-sheet">Отмена</button><button type="submit" class="btn">Сохранить</button></div>' +
      (edit ? '<div class="actions" style="margin-top:14px"><button type="button" class="btn danger" data-action="del-goal" data-id="' + g.id + '">Удалить цель</button></div>' : '') +
      '</form>');
    setTimeout(function () { var i = $("g-title"); if (i && !edit) i.focus(); }, 50);
  }

  var toastTimer = null;
  function toast(msg) { var t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 2600); }

  /* ---------- backup ---------- */
  function backupSheet() {
    openSheet('<h2>Резервная копия</h2>' +
      '<p class="hint">Все данные хранятся только на этом телефоне. Скопируй текст ниже и сохрани его в заметках или отправь себе: так цели не пропадут, если приложение переустановят.</p>' +
      '<div class="field"><label for="b-text">Твои данные</label><textarea id="b-text" readonly></textarea></div>' +
      '<div class="actions"><button type="button" class="btn" data-action="copy-backup">Скопировать</button></div>' +
      '<div class="field" style="margin-top:22px"><label for="b-in">Восстановить из копии</label><textarea id="b-in" placeholder="Вставь сюда скопированный текст"></textarea></div>' +
      '<div class="actions"><button type="button" class="btn ghost" data-action="close-sheet">Закрыть</button><button type="button" class="btn danger" data-action="restore">Восстановить</button></div>');
    $("b-text").value = JSON.stringify({ app: "neon-goals", goals: state.goals, habits: state.habits, daily: state.daily });
  }
  function copyBackup() {
    var ta = $("b-text");
    function fallback() { ta.focus(); ta.select(); try { document.execCommand("copy"); toast("Скопировано"); } catch (e) { toast("Выдели текст и скопируй вручную"); } }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(function () { toast("Скопировано"); }, fallback);
    else fallback();
  }
  function restoreBackup(btn) {
    var raw = $("b-in").value.trim(), data;
    try { data = JSON.parse(raw); } catch (e) { toast("Текст не похож на копию"); return; }
    if (!data || !Array.isArray(data.goals)) { toast("В тексте нет целей"); return; }
    if (delArmed !== "restore") {
      delArmed = "restore"; btn.textContent = "Заменить данные? Ещё раз";
      setTimeout(function () { if (delArmed === "restore") { delArmed = null; btn.textContent = "Восстановить"; } }, 3500);
      return;
    }
    delArmed = null;
    state.goals = data.goals; if (Array.isArray(data.habits)) state.habits = data.habits; if (Array.isArray(data.daily)) state.daily = data.daily; persist(); closeSheet(); renderAll(); toast("Данные восстановлены");
  }

  /* ---------- actions ---------- */
  var delArmed = null;
  document.addEventListener("click", function (e) {
    if (e.target === $("overlay")) { closeSheet(); return; }
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var a = el.dataset.action;
    if (a === "tab") { tab = el.dataset.tab; renderAll(); window.scrollTo(0, 0); }
    else if (a === "new-goal") goalForm(null);
    else if (a === "open") openDetail(el.dataset.id);
    else if (a === "back") closeDetail();
    else if (a === "close-sheet") closeSheet();
    else if (a === "backup") backupSheet();
    else if (a === "copy-backup") copyBackup();
    else if (a === "restore") restoreBackup(el);
    else if (a === "new-habit") habitForm(null);
    else if (a === "edit-habit") habitForm(findHabit(el.dataset.id));
    else if (a === "chip") el.setAttribute("aria-pressed", el.getAttribute("aria-pressed") === "true" ? "false" : "true");
    else if (a === "toggle-habit" || a === "toggle-day") {
      var hb = findHabit(el.dataset.h); if (!hb) return;
      var dk = a === "toggle-day" ? el.dataset.d : today();
      if (!hb.log) hb.log = {};
      if (hb.log[dk]) delete hb.log[dk]; else hb.log[dk] = 1;
      persist(); renderAll();
    }
    else if (a === "del-habit") {
      var key3 = "h" + el.dataset.id;
      if (delArmed !== key3) {
        delArmed = key3; el.textContent = "Точно удалить? Нажми ещё раз";
        setTimeout(function () { if (delArmed === key3) { delArmed = null; el.textContent = "Удалить привычку"; } }, 3500);
        return;
      }
      delArmed = null;
      state.habits = state.habits.filter(function (x) { return x.id !== el.dataset.id; });
      persist(); closeSheet(); renderAll();
    }
    else if (a === "resched") reschedSheet(el.dataset.g, el.dataset.t);
    else if (a === "day-prev") { viewDay = addDays(viewDay, -1); renderAll(); }
    else if (a === "day-next") { viewDay = addDays(viewDay, 1); renderAll(); }
    else if (a === "day-today") { viewDay = today(); renderAll(); }
    else if (a === "toggle-daily") {
      state.daily.forEach(function (x) { if (x.id === el.dataset.id) x.done = !x.done; });
      persist(); renderAll();
    }
    else if (a === "move-daily") {
      var mv = null; state.daily.forEach(function (x) { if (x.id === el.dataset.id) mv = x; });
      if (!mv) return;
      mv.date = mv.date < today() ? today() : addDays(mv.date, 1);
      persist(); renderAll(); toast("Перенесено: " + dayLabel(mv.date));
    }
    else if (a === "del-daily") {
      var key4 = "d" + el.dataset.id;
      if (delArmed !== key4) {
        delArmed = key4; el.style.color = "var(--danger)"; el.setAttribute("aria-label", "Нажми ещё раз, чтобы удалить");
        setTimeout(function () { if (delArmed === key4) { delArmed = null; el.style.color = ""; el.setAttribute("aria-label", "Удалить дело"); } }, 3000);
        return;
      }
      delArmed = null;
      state.daily = state.daily.filter(function (x) { return x.id !== el.dataset.id; });
      persist(); renderAll();
    }
    else if (a === "quick-date") { $("r-date").value = addDays(today(), +el.dataset.n); }
    else if (a === "edit-goal") goalForm(findGoal(openId));
    else if (a === "color") {
      var box = el.closest(".swatches"); box.dataset.color = el.dataset.color;
      box.querySelectorAll(".swatch").forEach(function (b) { b.setAttribute("aria-checked", b === el); });
    }
    else if (a === "toggle") {
      var g = findGoal(el.dataset.g); if (!g) return;
      var was = stats(g).achieved;
      g.tasks.forEach(function (t) { if (t.id === el.dataset.t) { t.done = !t.done; t.doneDate = t.done ? today() : null; } });
      persist(); renderAll();
      if (!was && stats(g).achieved) toast("Цель достигнута: " + g.title);
    }
    else if (a === "del-task") {
      var g2 = findGoal(el.dataset.g); if (!g2) return;
      var key = "t" + el.dataset.t;
      if (delArmed !== key) {
        delArmed = key; el.style.color = "var(--danger)"; el.setAttribute("aria-label", "Нажми ещё раз, чтобы удалить");
        setTimeout(function () { if (delArmed === key) { delArmed = null; el.style.color = ""; el.setAttribute("aria-label", "Удалить задачу"); } }, 3000);
        return;
      }
      delArmed = null;
      g2.tasks = g2.tasks.filter(function (t) { return t.id !== el.dataset.t; });
      persist(); renderAll();
    }
    else if (a === "force") {
      var g3 = findGoal(openId); if (!g3) return;
      g3.forced = !g3.forced; persist(); renderAll();
      if (g3.forced) toast("Цель достигнута: " + g3.title);
    }
    else if (a === "del-goal") {
      var key2 = "g" + el.dataset.id;
      if (delArmed !== key2) {
        delArmed = key2; el.textContent = "Точно удалить? Нажми ещё раз";
        setTimeout(function () { if (delArmed === key2) { delArmed = null; el.textContent = "Удалить цель"; } }, 3500);
        return;
      }
      delArmed = null;
      state.goals = state.goals.filter(function (x) { return x.id !== el.dataset.id; });
      persist(); closeSheet(); closeDetail();
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { if (!$("overlay").hidden) closeSheet(); else if (openId) closeDetail(); }
    if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches('.card[data-action="open"]')) { e.preventDefault(); openDetail(e.target.dataset.id); }
  });
  document.addEventListener("submit", function (e) {
    var f = e.target.closest("[data-form]"); if (!f) return;
    e.preventDefault();
    if (f.dataset.form === "daily") {
      var dt = $("d-title").value.trim(); if (!dt) return;
      state.daily.push({ id: uid(), title: dt, date: viewDay, done: false });
      $("d-title").value = ""; persist(); renderAll();
      var di = $("d-title"); if (di) di.focus();
      return;
    }
    if (f.dataset.form === "habit") { submitHabit(f); return; }
    if (f.dataset.form === "resched") { submitResched(f); return; }
    if (f.dataset.form === "goal") {
      var title = $("g-title").value.trim(); if (!title) return;
      var data = { title: title, desc: $("g-desc").value.trim(), cat: $("g-cat").value, deadline: $("g-dl").value || "", color: $("g-colors").dataset.color || "pink" };
      if (f.dataset.id) { var g = findGoal(f.dataset.id); Object.assign(g, data); }
      else { state.goals.unshift(Object.assign({ id: uid(), created: today(), forced: false, tasks: [] }, data)); }
      persist(); closeSheet(); renderAll();
    } else if (f.dataset.form === "task") {
      var g4 = findGoal(openId), tt = $("t-title").value.trim(), dd = $("t-date").value;
      if (!g4 || !tt || !dd) return;
      g4.tasks.push({ id: uid(), title: tt, date: dd, done: false, doneDate: null });
      $("t-title").value = ""; $("t-title").focus();
      persist(); renderAll();
    }
  });
  document.addEventListener("change", function (e) { if (e.target && e.target.id === "h-kind") updateKindBlocks(); });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) return;
    if (lastToday !== today()) { if (viewDay === lastToday) viewDay = today(); lastToday = today(); }
    renderAll();
  });

  /* ---------- start ---------- */
  renderAll();
  if ("serviceWorker" in navigator) {
    if (window.Capacitor) {
      navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }).catch(function () {});
      if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); }).catch(function () {});
    } else if (/^https?:$/.test(location.protocol)) { navigator.serviceWorker.register("sw.js").catch(function () {}); }
  }
})();
</script>
</body>
</html>

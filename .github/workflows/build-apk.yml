name: Сборка APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Установка зависимостей
        run: npm install

      - name: Подготовка Android-проекта
        run: |
          if [ ! -f android/gradlew ]; then
            rm -rf android
            npx cap add android
          fi
          rm -f android/local.properties
          npx cap sync android

      - name: Ключ подписи (чтобы APK ставился поверх старого)
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Ключ подписи взят из секрета."
          else
            echo "::warning::Секрет DEBUG_KEYSTORE_BASE64 не задан. APK подпишется временным ключом и не встанет поверх приложения, собранного на компьютере."
          fi

      - name: Сборка APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: neon-goals-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
